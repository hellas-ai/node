[workspace]
members = [
    "crates/adaptors",
    "crates/chain",
    "crates/cli",
    "crates/client",
    "crates/executor",
    "crates/kernel",
    "crates/models",
    "crates/rpc",
    "crates/wire",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hellas-ai/hellas"
documentation = "https://docs.rs"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
blake3 = "1"
bytes = "1"
catgrad = { git = "https://github.com/georgewhewell/catgrad", branch = "grw/feat/chat-types-on-chatgrad", default-features = false, features = [
    "serde",
] }
catgrad-llm = { git = "https://github.com/georgewhewell/catgrad", branch = "grw/feat/chat-types-on-chatgrad", default-features = false }
chatgrad = { git = "https://github.com/georgewhewell/catgrad", branch = "grw/feat/chat-types-on-chatgrad", default-features = false }
clap = { version = "4", features = ["derive"] }
commonware-actor = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-broadcast = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-codec = { git = "https://github.com/commonwarexyz/monorepo", branch = "main", default-features = false }
commonware-consensus = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-cryptography = { git = "https://github.com/commonwarexyz/monorepo", branch = "main", default-features = false }
commonware-glue = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-p2p = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-parallel = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-resolver = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-runtime = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-storage = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
commonware-utils = { git = "https://github.com/commonwarexyz/monorepo", branch = "main" }
dirs = "6"
ed25519-dalek = { version = "3.0.0-rc.0", default-features = false }
futures = "0.3"
half = "2.7.1"
hellas-adaptors = { path = "crates/adaptors", default-features = false }
hellas-chain = { path = "crates/chain", default-features = false }
hellas-client = { path = "crates/client", default-features = false }
hellas-executor = { path = "crates/executor", default-features = false }
hellas-kernel = { path = "crates/kernel", default-features = false }
hellas-models = { path = "crates/models", default-features = false }
hellas-rpc = { path = "crates/rpc", default-features = false }
hellas-wire = { path = "crates/wire", default-features = false }
hex = "0.4"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
iroh = { version = "1", default-features = false }
iroh-base = { version = "1", default-features = false }
iroh-blobs = { version = "0.103", default-features = false }
k256 = { version = "0.13", features = ["ecdsa"] }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "http-proto",
    "trace",
    "reqwest-blocking-client",
    "reqwest-rustls-webpki-roots",
] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
prometheus-client = "0.24"
rand = "0.8"
rand_core = "0.6"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
    "stream",
] }
rustls-webpki = "0.103.9"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_ipld_dagcbor = "=0.6.4"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "process",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
