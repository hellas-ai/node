[package]
name = "hellas-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "validator"
path = "src/bin/validator.rs"
required-features = ["node"]

[features]
default = ["node"]
api = ["dep:prost", "dep:tonic", "dep:tonic-prost"]
client = [
    "api",
    "dep:hellas-kernel",
    "dep:hellas-rpc",
    "dep:p256",
    "hellas-kernel/domain",
    "hellas-rpc/light-client",
    "hellas-rpc/mux-client",
]
compile = ["dep:tonic-prost-build"]
node = [
    "client",
    "server",
    "dep:axum",
    "dep:bytes",
    "dep:clap",
    "dep:commonware-actor",
    "dep:commonware-broadcast",
    "dep:commonware-codec",
    "dep:commonware-consensus",
    "dep:commonware-cryptography",
    "dep:commonware-glue",
    "dep:commonware-p2p",
    "dep:commonware-parallel",
    "dep:commonware-runtime",
    "dep:commonware-storage",
    "dep:commonware-utils",
    "dep:dirs",
    "dep:futures",
    "dep:hex",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:p256",
    "dep:prometheus-client",
    "dep:rand",
    "dep:serde",
    "dep:thiserror",
    "dep:tokio",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:hellas-kernel",
    "hellas-kernel/consensus",
    "hellas-rpc/light-client",
]
server = [
    "api",
    "dep:futures-util",
    "dep:hellas-kernel",
    "dep:hellas-rpc",
    "dep:p256",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-tungstenite",
    "dep:tracing",
    "hellas-kernel/domain",
    "hellas-rpc/light-client",
    "hellas-rpc/mux-server",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio-stream/sync",
    "tonic/server",
]
wasm-client = ["api", "dep:hellas-rpc", "hellas-rpc/mux-client"]

[dependencies]
axum = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
commonware-actor = { workspace = true, optional = true }
commonware-broadcast = { workspace = true, optional = true }
commonware-codec = { workspace = true, optional = true }
commonware-consensus = { workspace = true, optional = true }
commonware-cryptography = { workspace = true, optional = true, features = ["std"] }
commonware-glue = { workspace = true, optional = true }
commonware-p2p = { workspace = true, optional = true }
commonware-parallel = { workspace = true, optional = true }
commonware-runtime = { workspace = true, optional = true }
commonware-storage = { workspace = true, optional = true }
commonware-utils = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink"] }
hellas-kernel = { workspace = true, optional = true, default-features = false }
hellas-rpc = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["rt-tokio"] }
p256 = { version = "0.13", optional = true, default-features = false, features = ["ecdsa"] }
prometheus-client = { workspace = true, optional = true }
prost = { version = "0.14", optional = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
tokio-tungstenite = { version = "0.29", optional = true }
toml = { workspace = true, optional = true }
tonic = { version = "0.14", optional = true, default-features = false, features = ["codegen"] }
tonic-prost = { version = "0.14", optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["fmt", "json", "env-filter"] }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
commonware-consensus = { workspace = true, features = ["mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
hellas-kernel = { workspace = true, features = ["consensus", "test-support"] }
proptest = "1.11"
test-log = { version = "0.2", features = ["trace"] }
