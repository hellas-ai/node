[workspace]
members = [
  "crates/catnix",
  "crates/cli",
  "crates/core",
  "crates/executor",
  "crates/rpc",
  "crates/wire",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hellas-ai/node"
documentation = "https://docs.rs"

[workspace.dependencies]
base64 = "0.22"
blake3 = "1"
catgrad = { git = "https://github.com/georgewhewell/catgrad", branch = "grw/feat/chat-types-on-chatgrad", default-features = false, features = [
  "serde",
] }
catgrad-llm = { git = "https://github.com/georgewhewell/catgrad", branch = "grw/feat/chat-types-on-chatgrad", default-features = false }
catnix = { path = "crates/catnix", default-features = false }
chatgrad = { git = "https://github.com/georgewhewell/catgrad", branch = "grw/feat/chat-types-on-chatgrad", default-features = false }
half = "2.7.1"
hellas-core = { path = "crates/core", default-features = false }
hellas-executor = { path = "crates/executor", default-features = false }
hellas-rpc = { path = "crates/rpc", default-features = false }
hellas-wire = { path = "crates/wire", default-features = false }
iroh = { path = "../iroh/iroh", default-features = false }
iroh-base = { path = "../iroh/iroh-base", default-features = false }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
iroh-blobs = { version = "=0.101.0", default-features = false }
k256 = { version = "0.13", features = ["ecdsa"] }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
  "http-proto",
  "trace",
  "reqwest-blocking-client",
  "reqwest-rustls-webpki-roots",
] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "webpki-roots",
] }
rustls-webpki = "0.103.9"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_ipld_dagcbor = "=0.6.4"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
  "process",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
