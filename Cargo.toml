[workspace]
members = [
    "crates/cli",
    "crates/rpc",
    "crates/executor",
]
default-members = [
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hellas-ai/node"
documentation = "https://docs.rs"

[workspace.dependencies]
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.14"
tonic-iroh-transport = "0.2"
# tonic-iroh-transport = {path = "../tonic-iroh" }
hellas-rpc = { path = "crates/rpc" }
hellas-executor = { path = "crates/executor" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
