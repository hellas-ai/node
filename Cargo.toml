[package]
name = "hellas-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "validator"
path = "src/bin/validator.rs"

[features]
default = []
loom-tests = ["dep:loom"]

[dependencies]
bytes = { workspace = true }
base64ct = { version = "1", default-features = false, features = ["alloc"] }
clap = { workspace = true }
commonware-broadcast = { workspace = true }
commonware-codec = { workspace = true }
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true, features = ["std"] }
commonware-macros = { workspace = true }
commonware-p2p = { workspace = true }
commonware-parallel = { workspace = true }
commonware-runtime = { workspace = true }
commonware-storage = { workspace = true }
commonware-utils = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
hellas-rpc = { workspace = true, features = ["server", "mux-client", "mux-server"] }
hellas-types = { workspace = true, features = ["consensus"] }
hex = { workspace = true }
http = "1"
indexmap = { workspace = true }
loom = { version = "0.7", optional = true }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
prometheus-client = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rand = { workspace = true }
rand_core = { workspace = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde = { workspace = true }
sha2 = { version = "0.10", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.14", features = ["server", "channel"] }
ws-mux = { workspace = true, features = ["native-client", "server"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
commonware-consensus = { workspace = true, features = [ "mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
hellas-types = { workspace = true, features = ["consensus", "test-support"] }
hellas-rpc = { workspace = true, features = ["server", "mux-client"] }
proptest = "1.6"
test-log = { version = "0.2", features = ["trace"] }
tonic = { version = "0.14", features = ["server", "channel", "router"] }
