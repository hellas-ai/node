[workspace]
members = [
    "crates/cli",
    "crates/rpc",
    "crates/executor",
]
default-members = [
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hellas-ai/node"
documentation = "https://docs.rs"

[workspace.dependencies]
catgrad = { git = "https://github.com/georgewhewell/catgrad", branch = "grw/feat/runtime-primitives", default-features = false, features = ["serde"] }
catgrad-llm = { git = "https://github.com/georgewhewell/catgrad", branch = "grw/feat/runtime-primitives", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", features = ["gzip"] }
tonic-iroh-transport = { version = "0.9", default-features = false, features = ["otel"] }
# tonic-iroh-transport = {path = "../tonic-iroh-transport", default-features = false, features = ["otel"] }
# tonic-iroh-transport = { git = "https://github.com/hellas-ai/tonic-iroh-transport", branch = "grw/feat/discovery", default-features = false, features = ["otel"] }

hellas-rpc = { path = "crates/rpc", default-features = false }
hellas-executor = { path = "crates/executor" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-native-certs"] }
rustls-webpki = "0.103.9"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# [patch."https://github.com/georgewhewell/catgrad"]
# catgrad = { path = "../catgrad/catgrad" }
# catgrad-legacy = { path = "../catgrad/catgrad-legacy" }
# catgrad-llm = { path = "../catgrad/catgrad-llm" }

