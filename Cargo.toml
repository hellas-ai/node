[package]
name = "hellas-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "validator"
path = "src/bin/validator.rs"

[features]
default = []
perf-harness = []
loom-tests = ["dep:loom"]

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
commonware-actor = { workspace = true }
commonware-codec = { workspace = true }
commonware-coding = { workspace = true }
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-macros = { workspace = true }
commonware-p2p = { workspace = true }
commonware-parallel = { workspace = true }
commonware-runtime = { workspace = true }
commonware-storage = { workspace = true }
commonware-utils = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
hellas-rpc = { workspace = true, features = ["client", "server"] }
hellas-types = { workspace = true, features = ["consensus"] }
hex = { workspace = true }
indexmap = { workspace = true }
loom = { version = "0.7", optional = true }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
prometheus-client = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rand = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { version = "0.14", features = ["server", "channel"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
commonware-consensus = { workspace = true, features = ["fuzz", "mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
criterion = "0.7"
hellas-rpc = { workspace = true, features = ["client", "server"] }
proptest = "1.6"
test-log = { version = "0.2", features = ["trace"] }
tonic = { version = "0.14", features = ["server", "channel", "router"] }

[[bench]]
name = "shard_perf"
harness = false
required-features = ["perf-harness"]
