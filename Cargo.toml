[workspace]
members = [
    "crates/cli",
    "crates/rpc",
    "crates/executor",
]
default-members = [
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hellas-ai/node"
documentation = "https://docs.rs"

[workspace.dependencies]
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
catgrad = { git = "https://github.com/hellas-ai/catgrad", default-features = false, features = ["serde", "ndarray-backend"] }
catgrad-llm = { git = "https://github.com/hellas-ai/catgrad", default-features = false }
tokenizers = "0.21.4"
anyhow = "1"
half = "2"
memmap2 = "0.9"
safetensors = "0.7"
minijinja = "2.11.0"
minijinja-contrib = { version = "2.11.0", features = ["pycompat"] }
