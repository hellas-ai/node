[workspace]
members = [
    "crates/catnix",
    "crates/cli",
    "crates/core",
    "crates/executor",
    "crates/rpc",
    "crates/runtime",
]

# `crates/wire` is intentionally NOT a workspace member: its optional
# `discovery-mdns` feature pulls `iroh-mdns-address-lookup ^0.2` which
# conflicts with the iroh version `tonic-iroh-transport ^0.9` resolves
# to. External consumers (explorer, hellas-alto/chain, hellas-esp32)
# path-depend on it directly; the internal node binary does not. Fold
# back in when the iroh dep tree converges.
exclude = ["crates/wire"]
default-members = [
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hellas-ai/node"
documentation = "https://docs.rs"

[workspace.dependencies]
blake3 = "1"
catgrad = { git = "https://github.com/hellas-ai/catgrad", branch = "master", default-features = false, features = ["serde"] }
catgrad-llm = { git = "https://github.com/hellas-ai/catgrad", branch = "master", default-features = false }
catgrad-llm-models = { git = "https://github.com/hellas-ai/catgrad", branch = "master", package = "catgrad-llm-models" }
catnix = { path = "crates/catnix", default-features = false }
hellas-core = { path = "crates/core", default-features = false }
hellas-runtime = { path = "crates/runtime", default-features = false }
hellas-wire = { path = "crates/wire", default-features = false }
iroh = "0.98"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde_bytes = "0.11"
serde_ipld_dagcbor = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", features = ["gzip"] }
tonic-iroh-transport = { version = "0.9", default-features = false, features = ["otel", "native-defaults"] }
# tonic-iroh-transport = { path = "../tonic-iroh-transport", default-features = false, features = ["otel", "native-defaults"] }
# tonic-iroh-transport = { git = "https://github.com/hellas-ai/tonic-iroh-transport", branch = "grw/feat/iroh-0.98", default-features = false, features = ["otel", "native-defaults"] }

hellas-rpc = { path = "crates/rpc", default-features = false }
hellas-executor = { path = "crates/executor", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-native-certs"] }
rustls-webpki = "0.103.9"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# [patch."https://github.com/hellas-ai/catgrad"]
# catgrad = { path = "../catgrad/catgrad" }
# catgrad-llm = { path = "../catgrad/catgrad-llm" }

# [patch.crates-io]
