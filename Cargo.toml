[package]
name = "hellas-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "validator"
path = "src/bin/validator.rs"

[features]
default = []
perf-harness = []
loom-tests = ["dep:loom"]

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
commonware-actor = { workspace = true }
commonware-codec = { workspace = true }
commonware-coding = { workspace = true }
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-macros = { workspace = true }
commonware-p2p = { workspace = true }
commonware-parallel = { workspace = true }
commonware-runtime = { workspace = true }
commonware-storage = { workspace = true }
commonware-utils = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
hellas-types = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
loom = { version = "0.7", optional = true }
rand = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }

[dev-dependencies]
commonware-consensus = { workspace = true, features = ["fuzz", "mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
criterion = "0.8"
proptest = "1.6"

[[bench]]
name = "shard_perf"
harness = false
required-features = ["perf-harness"]
