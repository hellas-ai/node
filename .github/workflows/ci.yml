name: CI

on:
  pull_request:
  push:
    branches:
      - grw/feat/aiter

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  devshell:
    runs-on: [self-hosted, shared]
    steps:
      - uses: actions/checkout@v4
      - name: Build dev shell
        run: nix develop --command true

  matrix:
    runs-on: [self-hosted, shared]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        name: Enumerate CI checks
        run: |
          set -Eeu
          matrix="$(
            nix eval --json '.#ci.x86_64-linux.commands' --apply '
              cmds: {
                include = builtins.attrValues (
                  builtins.mapAttrs (name: cmd: { inherit name cmd; }) cmds
                );
              }
            '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  check:
    runs-on: [self-hosted, shared]
    name: ${{ matrix.name }}
    needs:
      - devshell
      - matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.cmd }}
        run: nix develop --command bash -c '${{ matrix.cmd }}'

  ci-passed:
    runs-on: [self-hosted, shared]
    if: always()
    name: CI passed
    needs:
      - devshell
      - matrix
      - check
    steps:
      - name: Require devshell + matrix + all checks succeeded
        run: |
          set -Eeu
          test '${{ needs.devshell.result }}' = 'success'
          test '${{ needs.matrix.result }}' = 'success'
          test '${{ needs.check.result }}' = 'success'

  # ─── extended (post-gate) builds ──────────────────────────────────────
  # Slow targets (static cross-builds, docker images). Push-only so PR
  # turnaround stays on the quick CI gate alone.

  extended-matrix:
    if: github.event_name == 'push'
    needs: ci-passed
    runs-on: [self-hosted, shared]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        name: Enumerate extended builds
        run: |
          set -Eeu
          matrix="$(
            nix eval --json '.#ci.x86_64-linux.builds' --apply '
              builds: {
                include = builtins.attrValues (
                  builtins.mapAttrs (name: attr: { inherit name attr; }) builds
                );
              }
            '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  extended-build:
    if: github.event_name == 'push'
    needs: extended-matrix
    runs-on: [self-hosted, shared]
    name: build:${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.extended-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: nix build .#${{ matrix.attr }}
        run: nix build --print-build-logs --no-link '.#packages.x86_64-linux.${{ matrix.attr }}'

  extended-builds-passed:
    if: always() && github.event_name == 'push'
    runs-on: [self-hosted, shared]
    name: Extended builds passed
    needs:
      - extended-matrix
      - extended-build
    steps:
      - name: Require extended-matrix + all builds succeeded
        run: |
          set -Eeu
          test '${{ needs.extended-matrix.result }}' = 'success'
          test '${{ needs.extended-build.result }}' = 'success'
