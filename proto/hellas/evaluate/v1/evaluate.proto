syntax = "proto3";

package hellas.evaluate.v1;

import "hellas/v1/hellas.proto";

// Binding/verifiable token evaluation. The execution environment commits to
// one canonical Catena causal-LM program, ABI, and content-addressed runtime
// inputs. Tokenization and text decoding remain outside this protocol.

service Evaluate {
  rpc CreateTicket(EvaluateRequest) returns (.hellas.v1.Ticket);
}

message EvaluateRequest {
  // Content-addressed TextExecution artifact; exactly 32 bytes.
  bytes text_execution = 1;
  .hellas.v1.PublicKey runner_public_key = 2;
  bytes execution_environment = 3; // ProgramManifest ContentId
  bytes nonce = 4; // exactly 32 bytes
  .hellas.v1.Assurance assurance = 5;
  // Whether the provider may persist and publish prompt- or token-bearing
  // artifacts through Courtesy. Absence means false.
  optional bool retain = 6;
}
