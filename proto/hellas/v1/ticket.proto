syntax = "proto3";

package hellas.v1;

import "hellas/v1/opaque.proto";
import "hellas/v1/symbolic.proto";

// Generic ticketing around work. Ticketing is independent of whether the work
// is symbolic/verifiable or opaque/producer-signed.

message CreateTicketRequest {
  WorkRequest request = 1;
}

message WorkRequest {
  oneof kind {
    SymbolicWorkRequest symbolic = 1;
    OpaqueWorkRequest opaque = 2;
  }
}

message Ticket {
  bytes request_commitment = 1; // exactly 32 bytes
  uint64 amount = 2;
  uint64 ttl_ms = 3;
}

message RunTicketRequest {
  bytes request_commitment = 1; // exactly 32 bytes
}
