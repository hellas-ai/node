syntax = "proto3";

package hellas.v1;

// Core Hellas work protocol. This file owns the generic ticket and execution
// surface plus transport-neutral event shapes. Scheme-specific ticket
// creation lives in evaluate.proto / fetch.proto; non-core helper APIs live in
// courtesy.proto; p2p/node discovery lives in swarm.proto.

service Execute {
  rpc RunTicket(RunTicketRequest) returns (stream WorkEvent);
}

message Ticket {
  bytes request_commitment = 1; // exactly 32 bytes
  uint64 amount = 2;
  uint64 ttl_ms = 3;
}

message RunTicketRequest {
  bytes request_commitment = 1; // exactly 32 bytes
  Signature signature = 2;
  PublicKey public_key = 3;
}

message PublicKey {
  uint32 kind = 1;
  bytes bytes = 2;
}

message Signature {
  uint32 kind = 1;
  bytes bytes = 2;
}

message InputEventBody {
  uint32 scheme = 1;
  uint64 sequence = 2;
  bytes previous_event = 3;
  string kind = 4;
  bytes payload_commitment = 5;
  bytes signer = 6;
  bytes canonicalization_id = 7;
}

message OutputEventBody {
  uint32 scheme = 1;
  bytes input_commitment = 2;
  bytes stream_id = 3;
  uint64 sequence = 4;
  bytes previous_event = 5;
  string kind = 6;
  bytes payload_commitment = 7;
  bytes signer = 8;
  bytes canonicalization_id = 9;
}

message InputEventEnvelope {
  InputEventBody body = 1;
  Signature signature = 2;
  PublicKey public_key = 3;
  bytes payload = 4;
}

message OutputEventEnvelope {
  OutputEventBody body = 1;
  Signature signature = 2;
  PublicKey public_key = 3;
  bytes payload = 4;
}

// Wire protocol: zero or more WorkChunk events, terminated by exactly one
// WorkFinished or WorkFailed, after which the stream ends. WorkChunk events
// carry signed output events as they become available. Successful result
// commitment lives in the terminal signed output event; WorkFinished is stream
// framing, not a scheme result carrier.
message WorkEvent {
  oneof kind {
    WorkChunk chunk = 1;
    WorkFinished finished = 2;
    WorkFailed failed = 3;
  }
}

message WorkChunk {
  OutputEventEnvelope output_event = 1;
}

message WorkFinished {
  FinishStatus status = 1;
  uint64 total_units = 2;
  repeated OutputEventEnvelope output_events = 3;
}

message WorkFailed {
  // Units emitted before failure (tokens for evaluate text, bytes for fetch).
  uint64 position = 1;
  string error = 2;
}

enum FinishStatus {
  FINISH_STATUS_UNSPECIFIED = 0;
  FINISH_STATUS_END_OF_SEQUENCE = 1;
  FINISH_STATUS_MAX_OUTPUT = 2;
  FINISH_STATUS_CANCELLED = 3;
}
