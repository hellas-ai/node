syntax = "proto3";

package hellas.courtesy.v1;

import "hellas/evaluate/v1/evaluate.proto";
import "hellas/v1/hellas.proto";

// Non-core execution conveniences. These APIs are not part of Hellas's
// token-level execution guarantee: an endpoint may offer package-name
// resolution, tokenization, chat templates, token decoding, and metrics, or
// decline to serve them. The resulting EvaluateRequest is the authoritative
// token-level request.

service Courtesy {
  rpc Open(.hellas.v1.OpenRequest) returns (.hellas.v1.OpenResponse);
  rpc QuoteTokens(QuoteTokensRequest) returns (QuoteResponse);
  rpc QuotePrompt(QuotePromptRequest) returns (QuoteResponse);
  rpc QuoteChatPrompt(QuoteChatPromptRequest) returns (QuoteResponse);
  rpc PutArtifact(PutArtifactRequest) returns (PutArtifactResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse);
  rpc DecodeTokens(stream DecodeTokensRequest) returns (stream DecodeTokensResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc GetPackageStats(GetPackageStatsRequest) returns (GetPackageStatsResponse);
}

message EvaluateStart {
  oneof kind {
    EvaluateGenesisStart genesis = 1;
    EvaluateArtifactStart artifact = 2;
  }
}

message EvaluateGenesisStart {}

message EvaluateArtifactStart {
  // Content-addressed TextArtifact artifact; exactly 32 bytes.
  bytes artifact = 1;
}

message QuoteTokensRequest {
  // Local package name used for routing. The execution_environment in the
  // returned EvaluateRequest binds the exact executable package identity.
  string package = 1;
  reserved 2;
  repeated uint32 prompt_token_ids = 3;
  uint32 max_new_tokens = 4;
  repeated uint32 stop_token_ids = 5;
  EvaluateStart start = 6;
  reserved 7;
  .hellas.v1.PublicKey runner_public_key = 8;
  .hellas.v1.Assurance assurance = 9;
  // Absence preserves the historical default: retain.
  optional bool retain = 10;
}

message QuoteResponse {
  .hellas.v1.Ticket ticket = 1;
  uint32 prompt_tokens = 2;
  reserved 3;
  .hellas.evaluate.v1.EvaluateRequest evaluate_request = 4;
}

// Convenience RPC: the server handles tokenization and evaluate request
// construction. Intended for lightweight clients (browsers) that don't have
// the tokenizer.
message QuotePromptRequest {
  string package = 1;
  reserved 2;
  string prompt = 3;
  uint32 max_new_tokens = 4;
  reserved 5;
  .hellas.v1.PublicKey runner_public_key = 6;
  .hellas.v1.Assurance assurance = 7;
  // Absence preserves the historical default: retain.
  optional bool retain = 8;
}

// Convenience RPC: chat-style prompt quoting.
// Like QuotePrompt but accepts a message array + system prompt.
// The server applies the model's chat template to produce the prompt.
message ChatMessage {
  string role = 1; // "user", "assistant"
  string content = 2;
}

message QuoteChatPromptRequest {
  string package = 1;
  reserved 2;
  repeated ChatMessage messages = 3;
  uint32 max_new_tokens = 4;
  string system_prompt = 5;
  reserved 6;
  .hellas.v1.PublicKey runner_public_key = 7;
  .hellas.v1.Assurance assurance = 8;
  // Absence preserves the historical default: retain.
  optional bool retain = 9;
}

// Store one canonical evaluate artifact by its BLAKE3 digest. This API does not
// publish evaluate metadata such as model locators or lazy substitutions; those
// are separate provider-local interpretation state.
message PutArtifactRequest {
  bytes canonical_artifact = 1;
}

message PutArtifactResponse {
  // BLAKE3 digest of canonical_artifact; exactly 32 bytes.
  bytes digest = 1;
}

message GetArtifactRequest {
  // BLAKE3 digest of canonical artifact bytes; exactly 32 bytes.
  bytes digest = 1;
}

message GetArtifactResponse {
  bytes canonical_artifact = 1;
}

// List executable packages known to the executor and their readiness status.
message ListPackagesRequest {}

message PackageInfo {
  string name = 1;
  reserved 2;
  PackageStatus status = 3;
  // Human-readable error when status is FAILED.
  string error = 4;
}

enum PackageStatus {
  PACKAGE_STATUS_UNSPECIFIED = 0;
  PACKAGE_STATUS_QUEUED = 1;
  PACKAGE_STATUS_LOADING = 2;
  PACKAGE_STATUS_READY = 3;
  PACKAGE_STATUS_FAILED = 4;
}

message ListPackagesResponse {
  repeated PackageInfo packages = 1;
}

// Convenience RPC: streaming token decoding for clients that do not carry a
// local tokenizer. The first request selects a package's presentation-side
// tokenizer; later requests may omit the package and carry token bytes only.
// Responses are incremental text deltas. Decoding is not attested execution.
message DecodeTokensRequest {
  string package = 1;
  reserved 2;
  // Raw token bytes (little-endian u32 token IDs, same format as Evaluate output).
  bytes token_bytes = 3;
}

message DecodeTokensResponse {
  // Decoded text (incremental delta; concatenate all responses for full output).
  string text = 1;
}

// Cumulative token statistics since node start.
message GetStatsRequest {}

message TokenStats {
  uint64 executions_started = 1;
  uint64 executions_completed = 2;
  uint64 executions_failed = 3;
  uint64 prompt_tokens = 4;
  uint64 cached_prompt_tokens = 5;
  uint64 cached_output_tokens = 6;
  uint64 prefill_tokens = 7;
  uint64 generated_tokens = 8;
}

message PackageTokenStats {
  string package = 1;
  TokenStats stats = 2;
}

message GetStatsResponse {
  TokenStats stats = 1;
  repeated PackageTokenStats package_stats = 2;
}

message GetPackageStatsRequest {
  string package = 1;
}

message GetPackageStatsResponse {
  string package = 1;
  TokenStats stats = 2;
}
