[package]
name = "hellas-executor"
description = "Executor for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["candle"]
candle = ["catgrad/candle-backend"]
candle-cuda = ["candle", "catgrad/cuda"]
candle-metal = ["candle", "catgrad/metal"]

[dependencies]
async-stream = "0.3"
blake3.workspace = true
catgrad = { workspace = true, default-features = false, features = ["serde"] }
catgrad-llm = { workspace = true, default-features = false }
catnix = { workspace = true }
hellas-core = { workspace = true }
hellas-rpc = { workspace = true, features = ["server", "client", "compression", "node"] }
hellas-runtime = { workspace = true, features = ["dag-cbor"] }
hf-hub = "0.5"
prometheus-client = "0.24"
serde_json = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = "0.7"
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
