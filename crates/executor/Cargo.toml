[package]
name = "hellas-executor"
description = "Executor for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["candle"]
candle = ["catgrad/candle-backend"]
candle-cuda = ["candle", "catgrad/cuda"]
candle-metal = ["candle", "catgrad/metal"]

[dependencies]
async-stream = "0.3"
catgrad = { workspace = true, default-features = false, features = ["serde"] }
catnix.workspace = true
chatgrad = { workspace = true, default-features = false }
futures-core = "0.3"
futures-util = "0.3"
hellas-core.workspace = true
hellas-rpc = { workspace = true, features = [
  "node",
  "execute",
  "evaluate",
  "fetch",
  "courtesy",
] }
hellas-wire = { workspace = true }
iroh-blobs = { workspace = true, features = ["fs-store"] }
prometheus-client = "0.24"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }
