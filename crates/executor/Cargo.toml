[package]
name = "hellas-executor"
description = "Executor for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["candle"]
candle = ["catgrad/candle-backend"]
candle-cuda = ["candle", "catgrad/cuda"]
candle-metal = ["candle", "catgrad/metal"]

[dependencies]
async-stream = "0.3"
blake3 = "1"
catgrad = { workspace = true, default-features = false, features = ["serde"] }
catgrad-llm = { workspace = true, default-features = false }
catnix.workspace = true
chatgrad = { workspace = true, default-features = false }
half = { workspace = true }
hellas-core.workspace = true
hellas-pb = { workspace = true, features = ["hellas", "symbolic", "opaque", "courtesy", "server"] }
hellas-rpc = { workspace = true, features = ["server", "client", "compression", "node"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
iroh-blobs = { workspace = true, features = ["fs-store"] }
prometheus-client = "0.24"
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = "0.7"
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
