[package]
name = "hellas-executor"
description = "Executor for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["candle"]
candle = ["catgrad/candle-backend"]
candle-cuda = ["candle", "catgrad/cuda"]
candle-metal = ["candle", "catgrad/metal"]

[dependencies]
hellas-rpc = { workspace = true, features = ["server", "client", "compression", "node"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
catgrad = { workspace = true, default-features = false, features = ["serde"] }
catgrad-llm = { workspace = true, default-features = false }
hf-hub = "0.5"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
serde_json = { workspace = true }
prometheus-client = "0.24"

[dev-dependencies]
proptest = "1"
