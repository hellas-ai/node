[package]
name = "hellas-wire"
description = "Transport-agnostic RPC wire layer for the Hellas protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []

# Transports
iroh = [
    "dep:iroh",
    "dep:n0-future",
    "dep:portable-atomic",
    "dep:tokio-stream",
]
# Discovery backends. `discovery-dht` pulls in `mainline` for the
# shared shard buckets, plus the small crypto/encoding deps shared with
# `discovery-mdns` (postcard, sha2, async-stream, serde). `discovery-mdns`
# pulls in the external `iroh-mdns-address-lookup` crate (iroh 1.0.0-rc.0
# moved mDNS out of the core iroh crate into its own crate).
discovery-dht = [
    "iroh",
    "dep:mainline",
    "dep:async-stream",
    "dep:postcard",
    "dep:serde",
    "dep:sha2",
]
discovery-mdns = [
    "iroh",
    "dep:async-stream",
    "dep:data-encoding",
    "dep:iroh-mdns-address-lookup",
    "dep:postcard",
]
h2 = ["dep:h2", "dep:http"]
h3 = []  # scaffold only

# Mux is shared infrastructure for transports without native substreams.
mux = []
ws = ["mux", "dep:tokio-tungstenite"]
ws-wasm = ["mux", "dep:ws_stream_wasm", "dep:wasm-bindgen-futures"]
ws-cf-do = ["mux", "dep:worker"]

# OpenTelemetry header propagation on Metadata
otel = ["dep:opentelemetry"]

# Server role (accept side; non-wasm)
server = []

[dependencies]
blake3 = { workspace = true }
bytes = "1"
futures = "0.3"
futures-core = "0.3"
pin-project-lite = "0.2"
smol_str = "0.3"
thiserror = { workspace = true }
tracing = { workspace = true }
web-time = "1"

# Optional transport deps
iroh = { workspace = true, optional = true }
n0-future = { version = "0.3", default-features = false, optional = true }
# Xtensa (esp32-s3) lacks native 64-bit atomics; portable-atomic
# provides a mutex-fallback `AtomicU64` so the iroh ConnectionPool's
# generation counter compiles on embedded targets.
portable-atomic = { version = "1", default-features = false, features = [
    "fallback",
], optional = true }
tokio-stream = { workspace = true, optional = true }
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
tokio-tungstenite = { version = "0.27", optional = true }
ws_stream_wasm = { version = "0.7", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
worker = { version = "0.6", optional = true, default-features = false }

opentelemetry = { workspace = true, optional = true }

# Discovery backend deps (gated behind discovery-{dht,mdns}).
async-stream = { version = "0.3", optional = true }
data-encoding = { version = "2", optional = true }
iroh-mdns-address-lookup = { version = "0.2", optional = true }
mainline = { version = "6", optional = true }
postcard = { version = "1", default-features = false, features = [
    "alloc",
], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "sync",
    "macros",
    "rt",
    "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["full"] }
