[package]
name = "hellas-cli"
description = "Command-line interface for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["client"]
# Remote-only client: no local executor, no tensor backend. Still pulls
# `hellas-rpc/node` so the CLI can prepare prompts via ModelAssets and
# configure policies without spawning a local executor.
client = [
    "hellas-rpc/node",
    "hellas-rpc/client",
    "hellas-rpc/compression",
    "hellas-rpc/discovery",
    "dep:tonic-iroh-transport",
    "dep:tonic",
    "tonic-iroh-transport/client",
    "tonic-iroh-transport/discovery-mdns",
    "tonic-iroh-transport/discovery-dht",
]

# Internal umbrella pulled in by every backend feature. Not user-facing:
# picking a backend (candle-cpu / cuda / candle-metal) activates `_backend`
# which adds the local executor actor and the RPC server bits so the binary
# can `serve`.
_backend = [
    "client",
    "dep:hellas-executor",
    "hellas-rpc/server",
    "tonic-iroh-transport/server",
]

candle-cpu   = ["_backend", "hellas-executor/candle"]
cuda         = ["_backend", "hellas-executor/candle-cuda"]
candle-metal = ["_backend", "hellas-executor/candle-metal"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
reqwest.workspace = true
catgrad-llm.workspace = true
serde.workspace = true
serde_json.workspace = true

anyhow = "1"
clap = { version = "4", features = ["derive"] }
hellas-rpc = { workspace = true, default-features = false }
hellas-executor = { workspace = true, default-features = false, optional = true }
tonic-iroh-transport = { workspace = true, default-features = false, optional = true }
tonic = { workspace = true, optional = true }
tokio-stream = { workspace = true }
futures = "0.3"
axum = "0.8"
prometheus-client = "0.24"
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"

# dev-dependencies- add 'compile' feature to hellas-rpc
[dev-dependencies]
# hellas-rpc = { workspace = true, features = ["compile"] }
test-log = { version = "0.2", default-features = false, features = ["trace"] }
tempfile = "3"
