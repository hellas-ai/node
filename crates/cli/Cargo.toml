[package]
name = "hellas-cli"
description = "Command-line interface for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["client", "local"]
# Remote-only client: no local executor, no tensor backend. Still pulls
# `hellas-rpc/node` so the CLI can prepare prompts via ModelAssets and
# configure policies without spawning a local executor.
client = [
    "hellas-rpc/node",
    "hellas-rpc/client",
    "hellas-rpc/compression",
    "hellas-rpc/discovery",
    "dep:tonic-iroh-transport",
    "dep:tonic",
    "tonic-iroh-transport/client",
    "tonic-iroh-transport/discovery-mdns",
    "tonic-iroh-transport/discovery-dht",
]
# Adds the candle-backed local executor actor.
local = ["client", "dep:hellas-executor", "hellas-executor/candle"]
serve = ["local", "hellas-rpc/server", "tonic-iroh-transport/server"]
cuda = ["local", "hellas-executor/candle-cuda"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
reqwest.workspace = true
catgrad-llm.workspace = true
serde.workspace = true
serde_json.workspace = true

anyhow = "1"
clap = { version = "4", features = ["derive"] }
hellas-rpc = { workspace = true, default-features = false }
hellas-executor = { workspace = true, default-features = false, optional = true }
tonic-iroh-transport = { workspace = true, default-features = false, optional = true }
tonic = { workspace = true, optional = true }
tokio-stream = { workspace = true }
futures = "0.3"
axum = "0.8"
prometheus-client = "0.24"
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
hellas-executor = { workspace = true, default-features = false, optional = true, features = ["candle-metal"] }

# dev-dependencies- add 'compile' feature to hellas-rpc
[dev-dependencies]
# hellas-rpc = { workspace = true, features = ["compile"] }
test-log = { version = "0.2", default-features = false, features = ["trace"] }
tempfile = "3"
