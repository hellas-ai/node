[package]
name = "hellas-cli"
description = "Command-line interface for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
serve = ["hellas-executor"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

anyhow = "1"
clap = { version = "4", features = ["derive"] }
hellas-rpc = { workspace = true, features = ["client", "server"] }
hellas-executor = { workspace = true, optional = true }
tonic-iroh-transport = { workspace = true, features = ["gossip"] }
tonic = { workspace = true }
tokio-stream = { workspace = true }

# dev-dependencies- add 'compile' feature to hellas-rpc
[dev-dependencies]
# hellas-rpc = { workspace = true, features = ["compile"] }
