[package]
name = "hellas-cli"
description = "Command-line interface for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["client", "discovery"]
client = ["hellas-rpc/client", "dep:tonic-iroh-transport", "tonic-iroh-transport/client"]
discovery = ["client", "dep:tonic", "tonic-iroh-transport/discovery", "dep:pkarr"]
serve = ["discovery", "hellas-rpc/server", "dep:hellas-executor", "dep:tonic", "tonic-iroh-transport/server"]
cuda = ["serve", "hellas-executor/candle-cuda"]
metal = ["serve", "hellas-executor/candle-metal"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

anyhow = "1"
clap = { version = "4", features = ["derive"] }
hellas-rpc = { workspace = true, default-features = false }
hellas-executor = { workspace = true, optional = true }
tonic-iroh-transport = { workspace = true, default-features = false, optional = true }
tonic = { workspace = true, optional = true }
tokio-stream = { workspace = true }
pkarr = { version = "5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
hellas-executor = { workspace = true, optional = true, features = ["candle-metal"] }

# dev-dependencies- add 'compile' feature to hellas-rpc
[dev-dependencies]
# hellas-rpc = { workspace = true, features = ["compile"] }
