[package]
name = "hellas-cli"
description = "Command-line interface for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []

apple-app-attest = ["dep:hellas-attestation", "hellas-attestation/apple-app-attest"]

node = ["dep:hellas-executor"]
# HTTP gateway front-end (OpenAI/Anthropic/plain APIs).
gateway = ["dep:hellas-gateway"]
evaluate = [
    "node",
    "gateway",
    "hellas-gateway/evaluate",
    "hellas-executor/evaluate",
    "dep:chatgrad",
    "dep:hellas-models",
]
candle = ["evaluate", "hellas-executor/candle"]
candle-cuda = ["candle", "hellas-executor/candle-cuda"]
candle-metal = ["candle", "hellas-executor/candle-metal"]
chain = [
    "dep:hellas-chain",
    "dep:hellas-kernel",
    "hellas-chain/client",
    "hellas-kernel/secp256k1",
    "hellas-kernel/webauthn",
]
indexer = ["chain", "hellas-chain/indexer"]
validator = ["indexer", "hellas-chain/validator"]

# OpenTelemetry / OTLP exporter + iroh-internal metrics. When off, none of the
# opentelemetry crates compile, the trace context propagation paths in
# `serve/node.rs` collapse to identity, and iroh's metrics
# module is not built.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:iroh-metrics",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]

anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64.workspace = true
chatgrad = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hellas-adaptors.workspace = true
hellas-attestation = { workspace = true, optional = true }
hellas-chain = { workspace = true, default-features = false, optional = true }
hellas-client = { workspace = true, features = ["iroh"] }
hellas-executor = { workspace = true, default-features = false, optional = true }
hellas-gateway = { workspace = true, optional = true }
hellas-kernel = { workspace = true, default-features = false, optional = true }
hellas-models = { workspace = true, optional = true }
hellas-rpc = { workspace = true, default-features = false, features = [
    "all-protocols",
] }
hellas-wire = { workspace = true, features = [
    "iroh",
    "discovery-dht",
    "discovery-mdns",
] }
hex.workspace = true
iroh = { workspace = true, features = ["tls-ring", "metrics"] }
iroh-mdns-address-lookup = "0.4"
iroh-metrics = { version = "1", default-features = false, features = [
    "metrics",
], optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
prometheus-client = { workspace = true }
qrcode = { version = "0.14", default-features = false }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true }
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true
