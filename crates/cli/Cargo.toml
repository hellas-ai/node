[package]
name = "hellas-cli"
description = "Command-line interface for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []

node = ["dep:hellas-executor", "hellas-rpc/server"]
evaluate = [
    "node",
    "hellas-executor/evaluate",
    "hellas-rpc/node",
    "dep:catgrad",
    "dep:chatgrad",
]
candle = ["evaluate", "hellas-executor/candle"]
candle-cuda = ["candle", "hellas-executor/candle-cuda"]
candle-metal = ["candle", "hellas-executor/candle-metal"]
chain = ["dep:hellas-chain", "dep:hellas-kernel", "hellas-chain/client"]
indexer = ["chain", "hellas-chain/indexer"]
validator = ["indexer", "hellas-chain/validator"]

# OpenTelemetry / OTLP exporter + iroh-internal metrics. When off, none of the
# opentelemetry crates compile, the trace context propagation paths in
# `execution.rs` / `serve/node.rs` collapse to identity, and iroh's metrics
# module is not built.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:iroh-metrics",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]

anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64.workspace = true
catgrad = { workspace = true, default-features = false, optional = true }
chatgrad = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hellas-chain = { workspace = true, default-features = false, optional = true }
hellas-executor = { workspace = true, default-features = false, optional = true }
hellas-kernel = { workspace = true, default-features = false, features = [
    "domain",
], optional = true }
hellas-rpc = { workspace = true, default-features = false, features = [
    "all-protocols",
] }
hellas-wire = { workspace = true, features = [
    "iroh",
    "discovery-dht",
    "discovery-mdns",
] }
hellas-wire-adaptors.workspace = true
hex.workspace = true
iroh = { workspace = true, features = ["tls-ring", "metrics"] }
iroh-mdns-address-lookup = "0.4"
iroh-metrics = { version = "1", default-features = false, features = [
    "metrics",
], optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
prometheus-client = { workspace = true }
qrcode = { version = "0.14", default-features = false }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true
