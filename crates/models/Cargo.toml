[package]
name = "hellas-models"
description = "Model assets: HuggingFace download, tokenizer, text decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
catgrad = { workspace = true, default-features = false, features = ["serde"] }
catgrad-llm-models = { workspace = true, default-features = false }
chrono = "0.4"
hellas-rpc = { workspace = true, default-features = false, features = [
    "execute",
] }
hellas-wire = { workspace = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
minijinja = { version = "2.11", features = ["json", "preserve_order"] }
minijinja-contrib = { version = "2.11", features = ["pycompat"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokenizers = { version = "0.22", default-features = false, features = [
    "progressbar",
    "fancy-regex",
] }

[target.'cfg(not(any(target_env = "musl", target_os = "windows")))'.dependencies]
tokenizers = { version = "0.22", features = ["onig", "esaxx_fast"] }
