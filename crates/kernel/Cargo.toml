[package]
name = "hellas-kernel"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
documentation.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
consensus = ["domain", "dep:commonware-consensus"]
domain = [
  "dep:base64ct",
  "dep:bs58",
  "dep:bytes",
  "dep:commonware-codec",
  "dep:commonware-cryptography",
  "dep:p256",
  "dep:serde_json",
  "dep:sha2",
  "dep:thiserror",
  "dep:url",
]
domain-std = ["domain", "commonware-codec/std", "commonware-cryptography/std"]
secp256k1 = ["dep:secp256k1"]
test-support = ["domain"]
webauthn = ["dep:p256", "dep:sha2"]

[dependencies]
base64ct = { version = "1", default-features = false, features = [
  "alloc",
], optional = true }
blake3 = { version = "1", default-features = false }
bs58 = { version = "0.5", optional = true }
bytes = { workspace = true, optional = true }
commonware-codec = { workspace = true, optional = true }
commonware-consensus = { workspace = true, optional = true }
commonware-cryptography = { workspace = true, optional = true }
p256 = { version = "0.13", default-features = false, features = [
  "ecdsa",
], optional = true }
secp256k1 = { version = "0.31", default-features = false, optional = true, features = [
  "alloc",
] }
serde_json = { version = "1", default-features = false, features = [
  "alloc",
], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
thiserror = { workspace = true, optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
allocation-counter = "0.8"
commonware-codec = { workspace = true }
commonware-cryptography = { workspace = true, features = ["mocks"] }
criterion = "0.8.2"
itf = "0.4"
proptest = "1"
proptest-state-machine = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stateright = "0.31"

[[bench]]
name = "apply"
harness = false

[[example]]
name = "end_to_end"
required-features = ["secp256k1"]

[[example]]
name = "mixed_open_auth"
required-features = ["secp256k1", "webauthn"]

[lints.rust]
elided-lifetimes-in-paths = "deny"
missing-copy-implementations = "deny"
missing-debug-implementations = "deny"
missing-docs = "deny"
rust-2018-idioms = "deny"
unsafe-code = "forbid"
unreachable-pub = "deny"
unused-extern-crates = "deny"
unused-must-use = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
alloc-instead-of-core = "deny"
dbg-macro = "deny"
disallowed-methods = "deny"
disallowed-types = "deny"
expect-used = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
print-stderr = "deny"
print-stdout = "deny"
std-instead-of-alloc = "deny"
std-instead-of-core = "deny"
todo = "deny"
unimplemented = "deny"
unwrap-used = "deny"

[lints.rustdoc]
bare-urls = "deny"
broken-intra-doc-links = "deny"
