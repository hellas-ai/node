[package]
name = "hellas-kernel"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
documentation.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Forgeable deterministic Sig/Seal placeholders for tests and modelling.
# Deliberately not part of any default or production feature set: a build
# without this feature physically cannot construct a placeholder witness.
placeholders = []
secp256k1 = ["dep:secp256k1"]
test-support = ["placeholders"]
webauthn = ["dep:p256", "dep:sha2"]

[dependencies]
blake3 = { version = "1", default-features = false }
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
], optional = true }
secp256k1 = { version = "0.31", default-features = false, optional = true, features = [
    "alloc",
] }
sha2 = { version = "0.11", default-features = false, optional = true }

[dev-dependencies]
# Self-dependency so the crate's own integration tests, benches, and
# examples see the placeholder constructors without shipping them in
# production builds.
hellas-kernel = { path = ".", features = ["placeholders"] }

allocation-counter = "0.8"
criterion = "0.8.2"
itf = "0.4"
proptest = "1"
proptest-state-machine = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stateright = "0.31"

[[bench]]
name = "apply"
harness = false

[[example]]
name = "end_to_end"
required-features = ["secp256k1"]

[[example]]
name = "mixed_open_auth"
required-features = ["secp256k1", "webauthn"]

[lints.rust]
elided-lifetimes-in-paths = "deny"
missing-copy-implementations = "deny"
missing-debug-implementations = "deny"
missing-docs = "deny"
rust-2018-idioms = "deny"
unsafe-code = "forbid"
unreachable-pub = "deny"
unused-extern-crates = "deny"
unused-must-use = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
alloc-instead-of-core = "deny"
dbg-macro = "deny"
disallowed-methods = "deny"
disallowed-types = "deny"
expect-used = "deny"
# Panic-freedom lock: every index/slice in the transition core must be
# `get`-based or carry a reviewed `#[allow]` stating why it cannot panic.
indexing-slicing = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
print-stderr = "deny"
print-stdout = "deny"
std-instead-of-alloc = "deny"
std-instead-of-core = "deny"
todo = "deny"
unimplemented = "deny"
unwrap-used = "deny"

[lints.rustdoc]
bare-urls = "deny"
broken-intra-doc-links = "deny"
