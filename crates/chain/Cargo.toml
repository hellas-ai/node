[package]
name = "hellas-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
api = ["dep:hellas-rpc", "hellas-rpc/chain"]
client = ["client-core", "hellas-wire/ws"]
client-core = [
    "api",
    "dep:commonware-codec",
    "dep:commonware-cryptography",
    "dep:commonware-parallel",
    "dep:hellas-wire",
    "dep:hellas-kernel",
    "dep:p256",
    "dep:rand",
    "dep:thiserror",
    "hellas-kernel/domain",
]
indexer = [
    "client",
    "dep:bytes",
    "dep:commonware-actor",
    "dep:commonware-codec",
    "dep:commonware-consensus",
    "dep:commonware-cryptography",
    "dep:commonware-glue",
    "dep:commonware-p2p",
    "dep:commonware-parallel",
    "dep:commonware-resolver",
    "dep:commonware-runtime",
    "dep:commonware-storage",
    "dep:commonware-utils",
    "dep:dirs",
    "dep:futures",
    "dep:futures-util",
    "dep:hex",
    "dep:p256",
    "dep:prometheus-client",
    "dep:rand",
    "dep:rand_core",
    "dep:serde",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:hellas-kernel",
    "hellas-kernel/consensus",
]
server = [
    "api",
    "dep:futures-util",
    "dep:hellas-wire",
    "dep:hellas-kernel",
    "dep:p256",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-tungstenite",
    "dep:tracing",
    "hellas-wire/ws",
    "hellas-kernel/domain",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio-stream/sync",
]
validator = [
    "indexer",
    "server",
    "dep:axum",
    "dep:commonware-broadcast",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:rand_core",
    "dep:toml",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
wasm-client = ["client-core", "hellas-wire/ws-wasm"]

[dependencies]
axum = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
commonware-actor = { workspace = true, optional = true }
commonware-broadcast = { workspace = true, optional = true }
commonware-codec = { workspace = true, optional = true }
commonware-consensus = { workspace = true, optional = true }
commonware-cryptography = { workspace = true, optional = true, features = [
    "std",
] }
commonware-glue = { workspace = true, optional = true }
commonware-p2p = { workspace = true, optional = true }
commonware-parallel = { workspace = true, optional = true }
commonware-resolver = { workspace = true, optional = true }
commonware-runtime = { workspace = true, optional = true }
commonware-storage = { workspace = true, optional = true }
commonware-utils = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = [
    "sink",
] }
hellas-kernel = { workspace = true, optional = true, default-features = false }
hellas-rpc = { workspace = true, optional = true, features = ["chain"] }
hellas-wire = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
p256 = { version = "0.13", optional = true, default-features = false, features = [
    "ecdsa",
] }
prometheus-client = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
tokio-tungstenite = { version = "0.29", optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = [
    "fmt",
    "json",
    "env-filter",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
commonware-consensus = { workspace = true, features = ["mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
hellas-kernel = { workspace = true, features = ["consensus", "test-support"] }
proptest = "1.11"
test-log = { version = "0.2", features = ["trace"] }
