[package]
name = "hellas-rpc"
description = "RPC implementation for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[package.metadata.cargo-machete]
ignored = [
    "blake3",
    "prettyplease",
    "proc-macro2",
    "prost-build",
    "prost-types",
    "protox",
    "quote",
    "syn",
]

[features]
default = []

# === Protocol modules ======================================================
# Each feature gates the generated items for one proto package, so binaries
# only include the protocols they use.
# `execute` is the foundation — evaluate, fetch, and courtesy all reference
# `hellas.v1.Ticket` and related types.
execute = []
evaluate = ["execute"]
fetch = ["execute", "dep:serde_json"]
chain = []
# Courtesy proto imports hellas.v1 (Ticket) and hellas.evaluate.v1
# (EvaluateRequest), so the feature must pull both forward.
courtesy = ["execute", "evaluate"]
swarm = []
all-protocols = ["swarm", "courtesy", "execute", "evaluate", "fetch", "chain"]

[dependencies]
blake3 = { workspace = true }
bytes = "1"
ed25519-dalek = { workspace = true }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
hellas-auth = { workspace = true }
hellas-p2p = { workspace = true }
hellas-wire = { workspace = true }
k256 = { workspace = true }
p256 = { workspace = true }
prost = { version = "0.14", default-features = false, features = ["derive"] }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true, optional = true }
smol_str = "0.3"
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
hellas-wire = { workspace = true, default-features = false }
prettyplease = "0.2"
proc-macro2 = "1"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.9"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
tokio.workspace = true
