[package]
name = "hellas-rpc"
description = "RPC implementation for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []

# === Protocol modules ======================================================
# Pick the protocols you want. Each pulls only its own hellas-pb feature, so
# downstream binary size scales with the protocols you actually use.
swarm    = ["hellas-pb/swarm"]
courtesy = ["hellas-pb/courtesy"]
execute  = ["hellas-pb/hellas"]   # `hellas.v1.Execute` service. Internal pb feature is named `hellas` for historical reasons.
symbolic = ["hellas-pb/symbolic"]
opaque   = ["hellas-pb/opaque"]
all-protocols = ["swarm", "courtesy", "execute", "symbolic", "opaque"]

# === Transports ============================================================
# Bare `iroh` brings the dep with no sub-features — useful when you only need
# the `PeerId: From<EndpointId>` conversion. For real outbound/inbound RPC
# you also enable `iroh-client` / `iroh-server`, which switch on the matching
# sub-feature in `tonic-iroh-transport` and (for `iroh-client`) bring in the
# typed call types' prost codec plus `hellas-pb`'s tonic-client stubs.
iroh        = ["dep:tonic-iroh-transport"]
iroh-client = [
  "iroh",
  "hellas-pb/client",
  "dep:tonic-prost",
  "tonic-iroh-transport/client",
]
iroh-server = ["iroh", "tonic-iroh-transport/server"]
# websocket, uart, etc. — added when the transport adapters land.

# === Server role ===========================================================
# Tonic's server runtime + hellas-pb's per-service server stubs. Orthogonal
# to protocol selection — combine with any subset of the protocol features.
server = ["tonic/server", "hellas-pb/server"]

# === Other knobs ===========================================================
compression = ["tonic/gzip", "tonic/zstd"]
# Opt-in: re-run codegen at build time. Mirrors `hellas-pb`'s policy — the
# generated `service_markers.rs` / `client_traits.rs` are checked into
# `src/generated/`, so downstream builds never need protoc. Enable this
# feature in the devshell when changing proto files; commit the regenerated
# files alongside the proto edit.
compile = [
  "dep:prost-build",
  "dep:prettyplease",
  "dep:proc-macro2",
  "dep:quote",
  "dep:syn",
]

# Discovery (mDNS + DHT) is iroh-only today; keeps `iroh` as its transport
# floor without pulling any protocol features.
discovery = [
  "iroh",
  "dep:futures",
  "dep:mainline",
  "tonic-iroh-transport/discovery-mdns",
  "tonic-iroh-transport/discovery-dht",
]

# Binary-side bundle: server + every protocol + the executor / model deps a
# `hellas-cli` / `hellas-executor` build needs. Not a "fat alias" — this is
# the curated set of deps for the node binary itself.
node = [
  "server",
  "all-protocols",
  "dep:catgrad",
  "dep:catgrad-llm",
  "dep:chatgrad",
  "dep:serde",
  "dep:serde_json",
  "dep:tokenizers",
  "dep:hf-hub",
]

[target.'cfg(not(any(target_env = "musl", target_os = "windows")))'.dependencies]
tokenizers = { version = "0.21", features = [
  "onig",
  "esaxx_fast",
], optional = true }

[dependencies]
catgrad = { workspace = true, default-features = false, features = [
  "serde",
], optional = true }
catgrad-llm = { workspace = true, default-features = false, optional = true }
chatgrad = { workspace = true, default-features = false, optional = true }
futures = { version = "0.3", optional = true }
futures-core = "0.3"
hellas-pb.workspace = true
hf-hub = { version = "0.5", default-features = false, features = [
  "ureq",
], optional = true }
http = "1"
http-body = "1"
pin-project = "1"
mainline = { version = "6", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
prost = { version = "0.14", default-features = false }
thiserror = { workspace = true }
tokenizers = { version = "0.21", default-features = false, features = [
  "progressbar",
  "fancy-regex",
], optional = true }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-iroh-transport = { workspace = true, default-features = false, optional = true }
tonic-prost = { version = "0.14", default-features = false, optional = true }
tower-layer = "0.3"
tower-service = "0.3"

[build-dependencies]
prettyplease = { version = "0.2", optional = true }
proc-macro2 = { version = "1", optional = true }
prost-build = { version = "0.14", optional = true }
quote = { version = "1", optional = true }
syn = { version = "2", features = ["full", "parsing"], optional = true }

[dev-dependencies]
tokio.workspace = true
