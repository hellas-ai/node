[package]
name = "hellas-rpc"
description = "RPC implementation for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
compression = ["tonic/gzip", "tonic/zstd"]
client = ["tonic/channel"]
discovery = [
    "client",
    "dep:futures",
    "dep:mainline",
    "dep:tonic-iroh-transport",
    "tonic-iroh-transport/discovery-mdns",
    "tonic-iroh-transport/discovery-dht",
]
server = ["tonic/server"]
compile = ["dep:tonic-prost-build"]
node = [
    "dep:catgrad",
    "dep:catgrad-llm",
    "dep:serde",
    "dep:serde_json",
    "dep:tokenizers",
    "dep:hf-hub",
]

[dependencies]
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"
prost = "0.14"
futures-core = "0.3"
futures = { version = "0.3", optional = true }
mainline = { version = "6", optional = true }
thiserror = { workspace = true }
tonic-iroh-transport = { workspace = true, default-features = false, optional = true }
catgrad = { workspace = true, default-features = false, features = ["serde"], optional = true }
catgrad-llm = { workspace = true, default-features = false, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["progressbar", "fancy-regex"], optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }

[target.'cfg(not(any(target_env = "musl", target_os = "windows")))'.dependencies]
tokenizers = { version = "0.21", features = ["onig", "esaxx_fast"], optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
tokio.workspace = true
