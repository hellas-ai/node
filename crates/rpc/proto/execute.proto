syntax = "proto3";

package hellas;

message GetQuoteRequest {
  string huggingface_model_id = 1;
  string huggingface_revision = 2;
  bytes input = 5;
  uint32 prompt_tokens = 6;
  uint32 max_new_tokens = 7;
  repeated uint32 stop_token_ids = 8;
  reserved 3, 4;
  bytes program = 9;
}

message GetQuoteResponse {
  string quote_id = 1;
  uint64 amount = 2;
  uint64 ttl_ms = 3;
}

message ExecuteRequest {
  string quote_id = 1;
  optional uint32 stream_batch_size = 2;
}
message ExecuteResponse {
  string execution_id = 1;
  string quote_id = 2;
}

message ExecuteStatusRequest { string execution_id = 1; }
enum ExecutionStatus {
  UNSPECIFIED = 0;
  PENDING = 1;
  RUNNING = 2;
  COMPLETED = 3;
  FAILED = 4;
}

message ExecuteStatusResponse {
  ExecutionStatus status = 1;
  uint64 progress = 2;
}
message ExecuteSnapshot {
  ExecutionStatus status = 1;
  uint64 progress = 2;
  bytes output = 3;
  // Populated when status is FAILED; empty otherwise.
  string error = 4;
}
message ExecuteProgress {
  ExecutionStatus status = 1;
  uint64 progress = 2;
  bytes output_chunk = 3;
  // Populated when status is FAILED; empty otherwise.
  string error = 4;
}
message ExecuteStreamEvent {
  oneof event {
    ExecuteSnapshot snapshot = 1;
    ExecuteProgress progress = 2;
  }
}

message ExecuteResultRequest { string execution_id = 1; }
message ExecuteResultResponse { bytes output = 1; }

// Convenience RPC: the server handles tokenization and graph construction.
// Intended for lightweight clients (browsers) that don't have the tokenizer.
message QuotePromptRequest {
  string huggingface_model_id = 1;
  string huggingface_revision = 2;
  string prompt = 3;
  uint32 max_new_tokens = 4;
}

message QuotePromptResponse {
  string quote_id = 1;
  uint64 amount = 2;
  uint64 ttl_ms = 3;
  uint32 prompt_tokens = 4;
}

// Convenience RPC: chat-style prompt quoting.
// Like QuotePrompt but accepts a message array + system prompt.
// The server applies the model's chat template to produce the prompt.
message ChatMessage {
  string role = 1;    // "user", "assistant"
  string content = 2;
}

message QuoteChatPromptRequest {
  string huggingface_model_id = 1;
  string huggingface_revision = 2;
  repeated ChatMessage messages = 3;
  uint32 max_new_tokens = 4;
  string system_prompt = 5;
}

message QuoteChatPromptResponse {
  string quote_id = 1;
  uint64 amount = 2;
  uint64 ttl_ms = 3;
  uint32 prompt_tokens = 4;
}

// List models known to the executor and their readiness status.
message ListModelsRequest {}

message ModelInfo {
  string model_id = 1;
  string revision = 2;
  ModelStatus status = 3;
  // Human-readable error when status is FAILED.
  string error = 4;
}

enum ModelStatus {
  MODEL_STATUS_UNSPECIFIED = 0;
  MODEL_STATUS_QUEUED = 1;
  MODEL_STATUS_LOADING = 2;
  MODEL_STATUS_READY = 3;
  MODEL_STATUS_FAILED = 4;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

// Convenience RPC: stateless token decoding.
// Client streams raw token bytes, server decodes with the model's tokenizer
// and streams back text chunks.
message DecodeTokensRequest {
  string huggingface_model_id = 1;
  string huggingface_revision = 2;
  // Raw token bytes (little-endian u32 token IDs, same format as ExecuteStream output).
  bytes token_bytes = 3;
}

message DecodeTokensResponse {
  // Decoded text (incremental delta — concatenate all responses for full output).
  string text = 1;
}

// Cumulative token statistics since node start.
message GetStatsRequest {}

message TokenStats {
  uint64 executions_started = 1;
  uint64 executions_completed = 2;
  uint64 executions_failed = 3;
  uint64 prompt_tokens = 4;
  uint64 cached_prompt_tokens = 5;
  uint64 cached_output_tokens = 6;
  uint64 prefill_tokens = 7;
  uint64 generated_tokens = 8;
}

message ModelTokenStats {
  string model_id = 1;
  TokenStats stats = 2;
}

message GetStatsResponse {
  TokenStats stats = 1;
  repeated ModelTokenStats model_stats = 2;
}

message GetModelStatsRequest {
  string model_id = 1;
}

message GetModelStatsResponse {
  string model_id = 1;
  TokenStats stats = 2;
}
