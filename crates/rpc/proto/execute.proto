syntax = "proto3";

package hellas;

message GetQuoteRequest {
  string huggingface_model_id = 1;
  string huggingface_revision = 2;
  bytes input = 5;
  uint32 prompt_tokens = 6;
  uint32 max_new_tokens = 7;
  repeated uint32 stop_token_ids = 8;
  reserved 3, 4;
  bytes program = 9;
}

message GetQuoteResponse {
  string quote_id = 1;
  uint64 amount = 2;
  uint64 ttl_ms = 3;
}

message ExecuteRequest {
  string quote_id = 1;
  optional uint32 stream_batch_size = 2;
}

// =====================================================================
// Streaming execution events.
//
// Wire protocol: zero or more `Chunk` events, terminated by exactly one
// `Outcome` event, after which the stream ends. There is no late-attach
// snapshot — the stream IS the execution; clients hold the receiver from
// `Execute` for the entire lifecycle and dropping it cancels the run.
// =====================================================================

message ExecuteStreamEvent {
  oneof event {
    Chunk chunk = 1;
    Outcome outcome = 2;
  }
}

// Incremental token chunk produced during decode.
message Chunk {
  // Cumulative position AFTER this chunk.
  uint64 position = 1;
  // Little-endian u32 token IDs.
  bytes tokens = 2;
}

// Terminal outcome of an execution.
message Outcome {
  oneof kind {
    Completed completed = 1;
    Failed failed = 2;
  }
}

message Completed {
  uint64 total_tokens = 1;
  StopReason stop_reason = 2;
  // Cid<TextReceipt> — exactly 32 bytes. Receivers reject other lengths.
  bytes receipt_cid = 3;
  // catnix `Claim::receipt_commitment` — BLAKE3 of the signed Receipt's
  // canonical Claim body. Exactly 32 bytes when present, empty when the
  // producer did not compute a catnix Receipt.
  bytes catnix_receipt_commitment = 4;
}

message Failed {
  // Tokens emitted before failure (for honest usage reporting).
  uint64 position = 1;
  string error = 2;
}

enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  END_OF_SEQUENCE = 1;
  MAX_NEW_TOKENS = 2;
  CANCELLED = 3;
}

// Convenience RPC: the server handles tokenization and graph construction.
// Intended for lightweight clients (browsers) that don't have the tokenizer.
message QuotePromptRequest {
  string huggingface_model_id = 1;
  string huggingface_revision = 2;
  string prompt = 3;
  uint32 max_new_tokens = 4;
  // Ordered preference list (each one of "f32", "f16", "bf16"). The server
  // picks the first entry it supports. Empty list lets the server pick its
  // preferred dtype freely. None of the entries supported → request is
  // refused with FailedPrecondition. The chosen dtype is reported back in
  // QuotePromptResponse.dtype.
  repeated string accept_dtypes = 5;
}

message QuotePromptResponse {
  string quote_id = 1;
  uint64 amount = 2;
  uint64 ttl_ms = 3;
  uint32 prompt_tokens = 4;
  // The dtype the server actually committed to running this quote at.
  string dtype = 5;
}

// Convenience RPC: chat-style prompt quoting.
// Like QuotePrompt but accepts a message array + system prompt.
// The server applies the model's chat template to produce the prompt.
message ChatMessage {
  string role = 1;    // "user", "assistant"
  string content = 2;
}

message QuoteChatPromptRequest {
  string huggingface_model_id = 1;
  string huggingface_revision = 2;
  repeated ChatMessage messages = 3;
  uint32 max_new_tokens = 4;
  string system_prompt = 5;
  // Ordered preference list (each one of "f32", "f16", "bf16"). The server
  // picks the first entry it supports. Empty list lets the server pick its
  // preferred dtype freely. None of the entries supported → request is
  // refused with FailedPrecondition. The chosen dtype is reported back in
  // QuoteChatPromptResponse.dtype.
  repeated string accept_dtypes = 6;
}

message QuoteChatPromptResponse {
  string quote_id = 1;
  uint64 amount = 2;
  uint64 ttl_ms = 3;
  uint32 prompt_tokens = 4;
  // The dtype the server actually committed to running this quote at.
  string dtype = 5;
}

// List models known to the executor and their readiness status.
message ListModelsRequest {}

message ModelInfo {
  string model_id = 1;
  string revision = 2;
  ModelStatus status = 3;
  // Human-readable error when status is FAILED.
  string error = 4;
}

enum ModelStatus {
  MODEL_STATUS_UNSPECIFIED = 0;
  MODEL_STATUS_QUEUED = 1;
  MODEL_STATUS_LOADING = 2;
  MODEL_STATUS_READY = 3;
  MODEL_STATUS_FAILED = 4;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

// Convenience RPC: stateless token decoding.
// Client streams raw token bytes, server decodes with the model's tokenizer
// and streams back text chunks.
message DecodeTokensRequest {
  string huggingface_model_id = 1;
  string huggingface_revision = 2;
  // Raw token bytes (little-endian u32 token IDs, same format as Execute output).
  bytes token_bytes = 3;
}

message DecodeTokensResponse {
  // Decoded text (incremental delta — concatenate all responses for full output).
  string text = 1;
}

// Cumulative token statistics since node start.
message GetStatsRequest {}

message TokenStats {
  uint64 executions_started = 1;
  uint64 executions_completed = 2;
  uint64 executions_failed = 3;
  uint64 prompt_tokens = 4;
  uint64 cached_prompt_tokens = 5;
  uint64 cached_output_tokens = 6;
  uint64 prefill_tokens = 7;
  uint64 generated_tokens = 8;
}

message ModelTokenStats {
  string model_id = 1;
  TokenStats stats = 2;
}

message GetStatsResponse {
  TokenStats stats = 1;
  repeated ModelTokenStats model_stats = 2;
}

message GetModelStatsRequest {
  string model_id = 1;
}

message GetModelStatsResponse {
  string model_id = 1;
  TokenStats stats = 2;
}
