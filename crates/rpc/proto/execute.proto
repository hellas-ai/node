syntax = "proto3";

package hellas;

message WeightsHint {
  string huggingface_model_id = 1;
  string revision = 2;
}

message LlmQuoteRequest {
  string huggingface_model_id = 1;
  string prompt = 2;
  // Optional; default to 16 when unset/zero
  uint32 max_seq = 3;
}

message GetQuoteRequest {
  oneof payload {
    bytes graph = 1;
    LlmQuoteRequest llm_prompt = 2;
  }
}
message GetQuoteResponse {
  string quote_id = 1;
  string graph_id = 2;
  uint64 amount = 3;
  string input = 4;
  WeightsHint resolved_weights = 5;
}

message GetGraphRequest { string graph_id = 1; }
message GetGraphResponse { bytes graph = 1; }

message ExecuteRequest { string quote_id = 1; }
message ExecuteResponse {
  string execution_id = 1;
  string quote_id = 2;
}

message ExecuteStatusRequest { string execution_id = 1; }
message ExecuteStatusResponse {
  string status = 1;
  uint64 progress = 2;
  bytes result = 3;
  optional string decoded = 4;
}
message ExecuteProgress {
  string status = 1;
  uint64 progress = 2;
  bytes chunk = 3;
  optional string decoded = 4;
}

message ExecuteResultRequest { string execution_id = 1; }
message ExecuteResultResponse {
  bytes result = 1;
  string decoded = 2;
}
