syntax = "proto3";

package hellas;

message GetQuoteRequest {
    bytes graph = 1;
    uint32 max_seq = 2;
    string prompt = 3;
    WeightsHint weights_hint = 4;

}

message GetQuoteResponse {
    string quote_id = 1;
    string graph_id = 2;
    uint64 amount = 3;
}

message WeightsHint {
    string huggingface_model_id = 1;
    string revision = 2;
}

message ExecuteRequest {
    bytes quote_id = 1;
}

message ExecuteResponse {
    string execution_id = 1;
    string quote_id = 2;
}

message ExecuteStatusRequest {
    string execution_id = 1;
}

message ExecuteStatusResponse {
    string status = 1;
    bytes result = 2;
}

message ExecuteStatusDiff {
    string status = 1;
    bytes result = 2;
}

message ExecuteResultRequest {
    string execution_id = 1;
}

message ExecuteResultResponse {
    string result = 1;
}
