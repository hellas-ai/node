[package]
name = "hellas-gateway"
description = "HTTP gateway for the Hellas execution network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
evaluate = [
    "dep:hellas-executor",
    "hellas-executor/evaluate",
    "dep:hellas-store",
    "dep:tokio-stream",
]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
futures = "0.3"
hellas-adaptors.workspace = true
hellas-client = { workspace = true, features = ["iroh", "evaluate"] }
hellas-executor = { workspace = true, optional = true }
hellas-presentation.workspace = true
hellas-rpc = { workspace = true, features = ["courtesy", "fetch"] }
hellas-store = { workspace = true, optional = true }
hellas-wire = { workspace = true, features = ["iroh"] }
iroh.workspace = true
prometheus-client.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, optional = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing.workspace = true
